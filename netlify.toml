[build]
  command = "npm install && npm run build"
  publish = "dist/public"
  base = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Build only frontend for static deployment
[build.processing]
  skip_processing = false