version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Propose a release only after it has been public for a week. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Each of these major versions is a migration, not an update: the build fails on React 19,
      # Tailwind 4 and Vite 8, and Express 5 rejects the wildcard routes in server/. CI does not start
      # the server, so the Express one even shows green. Move to them on purpose, one at a time,
      # and remove the entry when it is done. Minor and patch releases still arrive.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
  # keeps the SHA pins in .github/workflows current, as one pull request instead of one per action
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
