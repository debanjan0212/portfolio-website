version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # keeps the SHA pins in .github/workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
